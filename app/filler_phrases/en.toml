# THE PHRASES THAT COVER THE WAIT, in English (docs/notes/hands-free-voice.md
# §7, Decision 5A; app/fillers.py reads and checks this file).
#   short: said the instant the question is taken, under a second;
#   long:  for a long wait, about two seconds — where the "uhm" lives.
# Nothing here claims a result before there is one. A text that sounds wrong
# in a voice is dropped from here (M5: each text heard once in each voice).
short = [
    "Let me check.",
    "Let's see…",
    "One moment.",
    "Just a second.",
    "Let me look.",
]
long = [
    "Uhm… let me see what I can find on this.",
    "Still looking, one moment.",
    "Let me look a little further.",
    "Uhm… this takes a little longer, bear with me.",
    "Hmm, still searching, just a moment.",
]

# THE PHRASES THAT COVER THE WAIT, in Italian (docs/notes/hands-free-voice.md
# §7, Decision 5A; app/fillers.py reads and checks this file).
#   short: said the instant the question is taken, under a second;
#   long:  for a long wait, about two seconds — where the "uhm" lives.
# Nothing here claims a result before there is one. A text that sounds wrong
# in a voice is dropped from here (M5: each text heard once in each voice).
short = [
    "Vediamo…",
    "Un attimo.",
    "Un momento.",
    "Controllo subito.",
    "Fammi vedere.",
]
long = [
    "Uhm… sto cercando quello che trovo sull'argomento.",
    "Sto ancora cercando, un momento.",
    "Mmm, vediamo cosa dicono le fonti.",
    "Uhm… ci vuole ancora un attimo di pazienza.",
    "Ehm, sto ancora guardando, un istante.",
]

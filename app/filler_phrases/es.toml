# THE PHRASES THAT COVER THE WAIT, in Spanish (docs/notes/hands-free-voice.md
# §7, Decision 5A; app/fillers.py reads and checks this file).
#   short: said the instant the question is taken, under a second;
#   long:  for a long wait, about two seconds — where the "eh" lives.
# Nothing here claims a result before there is one. A text that sounds wrong
# in a voice is dropped from here (M5: each text heard once in each voice).
short = [
    "A ver…",
    "Un momento.",
    "Déjame ver.",
    "Un segundo.",
    "Lo miro.",
]
long = [
    "Eh… a ver qué encuentro sobre esto.",
    "Sigo buscando, un momento.",
    "Mmm, estoy revisando las fuentes.",
    "Eh… esto tarda un poco más, paciencia.",
    "Hmm, todavía estoy buscando, un instante.",
]

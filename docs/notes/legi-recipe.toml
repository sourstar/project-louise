# LEGI — the consolidated French law (DILA's open data), every version of
# every article, and every text, section and structure file, each its own
# record (app/plugins/legi/source.py; docs/notes/legal-fr-de-eu.md §2;
# docs/notes/legal-collections-nemotron.md). DRAFT, 2026-11-08: nothing is
# created until `hold collection new` runs ON THE NODE — it mints a
# PERMANENT collection_id and space_id from these bytes, and reads there
# what only the node can say:
#
#   space.encoder.engine   the run the reference vectors are computed with,
#                          read with `louise hold embedder run --encoder
#                          http://192.168.178.10:30286 --api vega --model
#                          vega-nemotron-3-embed-1b` (the comment under
#                          [space.encoder]) and written there as the table
#                          [space.encoder.engine]: `new` refuses a recipe
#                          without it, and holds the endpoint to it. It is
#                          outside space_id, so the three legal recipes stay
#                          in one space whatever engine each names.
#   space.tolerance        MEASURED by `new` (calibrate, then tolerance),
#                          never typed
#
# Case A of docs/notes/new-collection.md: a new space, the first of the
# three legal collections in it (legi, then neuris and eurlex by case E,
# phase 2). THE [space] BLOCK IS BYTE-IDENTICAL IN THE THREE LEGAL RECIPES:
# one space_id, one list across French, German and EU law. A dry run first
# (resolve and check, then what the run would do; it writes nothing):
#
#   louise hold collection new legi --recipe /config/recipes/legi-recipe.toml --name legi \
#       --encoder http://192.168.178.10:30286 --api vega --embed-model vega-nemotron-3-embed-1b \
#       --cpu-model vega-nemotron-3-embed-1b-cpu --dry-run
#
# then the same without --dry-run:
#
#   louise hold collection new legi --recipe /config/recipes/legi-recipe.toml --name legi --encoder http://192.168.178.10:30286 --api vega --embed-model vega-nemotron-3-embed-1b --cpu-model vega-nemotron-3-embed-1b-cpu
#
# The licence is YELLOW (operator, 2026-11-08, choice A): Licence Ouverte 2.0
# is open with a condition, attribution, which 04 §4.4 puts in yellow, as
# normattiva's CC BY 4.0. Its terms are app/plugins/legi/TERMS.txt (Etalab's
# LO.md byte for byte), pinned below by sha256; the node acknowledges them
# (`louise hold collection ack legi`) before the data is used (invariant 9).
# DILA's personal-data warning, read on the node on 2026-11-08, sets no class.
# The fetch (`hold fetch legi --profile full`) is the baseline (1.17 GB)
# and every daily increment after it, two connections at most, listed from
# the directory's own index page; a pass after it fetches the new
# increments only. Embedding stays off until the gate has passed and the
# operator turns it on (new-collection.md).

[descriptive]
title = "LEGI — the consolidated French law, every version"
summary = "The codes, laws, ordinances, decrees and a selection of arrêtés of the French Republic from DILA's LEGI open data (Légifrance), every version of every article as its own record, searchable as of any date, with each text's visas, signatures and notes, its sections and its structure; repealed articles in their last text, labelled. JORF, the originals as published, is not in this collection."

[space]
dim = 2048
dtype = "f16"
# 8191, not 8192: llama.cpp embeds at most context_size − 1 tokens, and the model runs
# context_size 8192 (München's dry run, 2026-11-08); wikidata's space on the same model is 8191
ctx = 8191
cut = "tokens"
pooling = "mean"
normalise = true
exactness = "exact"
epoch = "0"
evaluation = ""
# tolerance: measured by `new`, never typed

[space.calibration]
set = "sha256:7d06a2f6a4a773da01a517cb30571cac421753df3e30b20fca4716e5441fbf0f"

[space.calibration.quorum]
n = 16
min_pass = 12

[space.document]
instruction = "passage: "

[space.query]
instruction = "query: "

[space.encoder]
weights = "sha256:09596cedbdf2a0d164b37083794632be55dcb2aa2abcf02fb995dfdccbecbf2c"
label = "nvidia/Nemotron-3-Embed-1B-BF16 (c0c9fea9; f16 GGUF, llama.cpp 3f8af15a; vega-nemotron-3-embed-1b)"
# [space.encoder.engine]: read on the node with `louise hold embedder run --encoder http://192.168.178.10:30286 --api vega --model vega-nemotron-3-embed-1b`; `new` holds the endpoint to it.

# The ONGOING work per month, in tokens: TO MEASURE at the first month of
# increments. Draft from the node's probe (2026-10-28): the newest increment
# held 1,402 LEGIARTI files; ~21 increments a month and ~500 tokens an
# article version put it near 15 M before the carry by chunk hash, which
# embeds an unchanged article text once.
[work]
tokens = 15000000
per = "P1M"

[origin]
form = "DILA's LEGI open-data tarballs (echanges.dila.gouv.fr/OPENDATA/LEGI/): the latest baseline (Freemium_legi_global_*), then every daily increment (LEGI_*) dated after it in timestamp order, each increment's files then its deletion lists; one record per XML file (ARTICLE, TEXTE_VERSION, SECTION_TA, TEXTELR), its bytes exactly as the tarball holds them; not the Légifrance (PISTE) API, which needs OAuth2 credentials and quotas, nor the HTML pages; JORF, the originals that carry an ELI, is scope not yet taken (legal-fr-de-eu.md §2.1)"
unit = "container-member"
clock = "Europe/Paris"
cutoff_rule = "update-files"
jurisdiction = "FR"

# The spec is the plugin's (app/acquire/specs.py LEGI_SPEC): the
# directory's index page is the listing, each file published once under a
# dated name and fetched once (DeltaSpec full-resync against fetch_files).

[license]
class = "yellow"
terms_sha256 = "sha256:a1deb9d7554ad10e041dbd7440b3dec0ac0d3679f9e1655ee9d850908b015995"

[validation]
checks = ["roots", "records", "chunks", "records-vs-origin", "license", "signature", "calibration", "vectors-sample"]
required = []

[validation.sample.records]
shards = "0.05"

[validation.sample.chunks]
shards = "0.05"

[validation.sample."vectors-sample"]
shards = "0.05"

[validation.sample."records-vs-origin"]
shards = "0.05"

# Layers (`akn_article`, the shared legal space's chunker), slicing (`legi`:
# kind and year, parts cut by content), the profile (the validity axis,
# one record per article version) and the facets (legal-chunking-
# retrieval.md §4 R2: `extra.in_force`, `extra.eli_type_document`,
# `extra.eli_title`, `date` and `extra.version_from` as ranges; filters,
# never weights) are the plugin's defaults
# (app/plugins/legi/source.py, app/pack/slicing.py). The licence class is the
# plugin's, green.

# THE SHARED LEGAL LAYER, byte-identical in the three legal recipes (legi,
# neuris, eurlex) — the chunker is inside space_id. `legal_article`
# (app/chunking_legal.py; docs/notes/legal-chunking-retrieval.md, operator
# 2026-11-08: no truncation, the four systems' own numbering; pieces 1 and 2
# "by design"): one chunk per article, a longer one split at its paragraphs,
# points, sentences, then token windows; the act's title and the article's
# place as a header on every piece; one outline chunk per record. The window
# is counted in Nemotron-3-Embed-1B's own tokens (its tokenizer.json at
# c0c9fea9, 17,077,678 bytes, sha256 below; München 2026-11-08), placed in
# TOKENIZERS_DIR as <hex>.json: 8,191 (ctx) less "passage: " and a margin of
# 16 for the join and the special tokens.
[[layers]]
rule = "default"

[layers.chunker]
id = "legal_article"
version = 3

[layers.chunker.params]
tokenizer = "sha256:797410dfb649a5b9ba92bc4fef7dbf4022d00e73de6867c4ac199a8846439421"
max_tokens = 8175
header = true
outline = true

[layers.input]
form = "text"

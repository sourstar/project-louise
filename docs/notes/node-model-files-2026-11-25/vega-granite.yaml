backend: vega-louise-llama-cpp
context_size: 512
embeddings: true
env:
    GGML_SYCL_ENABLE_DNN: "0"
    GGML_SYCL_FA_ONEDNN: "0"
    NEO_CACHE_DIR: /data/louise-cache/neo-cache
flash_attention: "on"
gpu_layers: 999
mmap: true
name: vega-granite
options:
    - fit:off
    - parallel:1
    - pooling:cls
    - ubatch:512
parameters:
    batch: 512
    model: weights/granite/granite-embedding-107m-multilingual-f16.gguf
    seed: 0
threads: 6

backend: vega-louise-llama-cpp
context_size: 8192
embeddings: true
env:
    GGML_SYCL_ENABLE_DNN: "0"
    GGML_SYCL_FA_ONEDNN: "0"
    NEO_CACHE_DIR: /data/louise-cache/neo-cache
flash_attention: "on"
gpu_layers: 999
mmap: true
name: vega-qwen3-embedding-4b
options:
    - fit:off
    - context_on_demand
    - context_canary:true
    - parallel:1
    - pooling:last
    - ubatch:2048
parameters:
    batch: 2048
    model: weights/llama-embed/Qwen3-Embedding-4B-Q4_K_M.gguf
    seed: 0
threads: 6

backend: vega-louise-llama-cpp
chat_template_kwargs:
    enable_thinking: false
context_size: 16384
draft_model: ""
env:
    GGML_SYCL_ENABLE_DNN: "0"
    GGML_SYCL_FA_ONEDNN: "0"
    NEO_CACHE_DIR: /data/louise-cache/neo-cache
flash_attention: "on"
function:
    automatic_tool_parsing_fallback: true
    grammar:
        disable: true
gpu_layers: 999
known_usecases:
    - chat
mmap: true
mmproj: ""
name: louise-chat-qwen3.5-4b-q4
options:
    - use_jinja:true
    - parallel:1
    - cache_ram:0
    - ubatch:512
parameters:
    batch: 2048
    min_p: 0
    model: llama-cpp/models/Qwen_Qwen3.5-4B-Q4_K_M.gguf
    presence_penalty: 1.5
    repeat_penalty: 1
    seed: 0
    temperature: 0.7
    top_k: 20
    top_p: 0.8
reasoning_effort: none
template:
    use_tokenizer_template: true
threads: 6

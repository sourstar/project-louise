# EUR-Lex5, re-made (operator, 2026-11-28: "B", parser 6; "A", its name;
# architecture: case E in the shared legal space, `--space-from legi_F`).
# EUR-Lex5.next's recipe (the node's /config/recipes/eurlex-recipe-bd6afc0.toml,
# its Codex's chunker legal_article 4) with:
#   - record_line = 3: `figures` (RAGE's plates, #998) and `origin_gaps`
#     (09 §9.5) on every line;
#   - "figures" in validation.checks (template: line >= 2 must check its
#     plates), sampled as the other checks;
#   - parser 6, the plugin's (app/plugins/eurlex/source.py).
# The corpus is the one held (/build/origin-EUR-Lex4), carried by its path.
#
#   louise hold collection new eurlex --recipe /config/recipes/eurlex5-recipe.toml \
#       --name EUR-Lex5 --space-from legi_F --cpu-model vega-nemotron-3-embed-1b-cpu --dry-run

record_line = 3

[descriptive]
title = "EUR-Lex — the law of the European Union, every version, every language"
summary = "Every act of the Official Journal (sector 3) and every consolidated version (sector 0) that Cellar holds in Formex, each version of each act in each official language its own record, searchable as of any date; each language a slice a node holds and embeds on its own. Only the Official Journal is authentic; consolidated texts have no legal effect."

[space]
dim = 2048
dtype = "f16"
ctx = 8191
cut = "tokens"
pooling = "mean"
normalise = true
exactness = "exact"
epoch = "0"
evaluation = ""

[space.calibration]
set = "sha256:7d06a2f6a4a773da01a517cb30571cac421753df3e30b20fca4716e5441fbf0f"

[space.calibration.quorum]
n = 16
min_pass = 12

[space.document]
instruction = "passage: "

[space.query]
instruction = "query: "

[space.encoder]
weights = "sha256:09596cedbdf2a0d164b37083794632be55dcb2aa2abcf02fb995dfdccbecbf2c"
label = "nvidia/Nemotron-3-Embed-1B-BF16 (c0c9fea9; f16 GGUF, llama.cpp 3f8af15a; vega-nemotron-3-embed-1b)"

[work]
tokens = 60000000
per = "P1M"

[origin]
form = "Cellar by content negotiation on /resource/celex/<CELEX>, per act version and language: the work's non-inferred tree scoped to the language, which holds every assertion about the act, and the items of the best form the tree lists (Formex 4, else XHTML, HTML, then PDF; the Formex body picked by the wrapper's DOC.MAIN.PUB name, never by order); no branch notice (parser 4, 2026-11-15). Bulk first: the unit of every act the Data Dump holds is built from it (its MTD trees and its items, the same bytes Cellar serves, which records-vs-origin re-fetches); what the dump lacks (consolidations, acts not in force: the history slice) is listed by SPARQL in windows of one CELEX year; not the SOAP service (registration, a quota) (legal-fr-de-eu.md §4.1, §7.1; app/acquire/eurlex_dump.py)"
unit = "file"
clock = "Europe/Luxembourg"
cutoff_rule = "record-date"
jurisdiction = "EU"


[license]
class = "yellow"
terms_sha256 = "sha256:080b40b605f79a9468dc9ddb532868ee067928ffea036990e410199c7cf613db"

[validation]
checks = ["roots", "records", "chunks", "records-vs-origin", "license", "signature", "calibration", "vectors-sample", "figures"]
required = []

[validation.sample.records]
shards = "0.05"

[validation.sample.chunks]
shards = "0.05"

[validation.sample."vectors-sample"]
shards = "0.05"

[validation.sample."records-vs-origin"]
shards = "0.01"

[validation.sample.figures]
shards = "0.05"


[[layers]]
rule = "default"

[layers.chunker]
id = "legal_article"
version = 4

[layers.chunker.params]
tokenizer = "sha256:797410dfb649a5b9ba92bc4fef7dbf4022d00e73de6867c4ac199a8846439421"
max_tokens = 8175
header = true
outline = true

[layers.input]
form = "text"

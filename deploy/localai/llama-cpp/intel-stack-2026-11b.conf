# The NEWEST Intel GPU stack for the SYCL engine (operator, 2026-11-08: "I want the newest everything, check
# online that it fits together before proceeding"). Read by build.sh when INTEL_STACK=<this file>, as
# intel-stack-2026-11.conf is.
#
# Why not the 2026-11 stack: on the node, oneAPI 2026.1.0's Level Zero adapter got
# ZE_RESULT_ERROR_UNSUPPORTED_VERSION from zeInit/zeInitDrivers with compute-runtime 26.35 and loader 1.32, and
# SYCL fell back to OpenCL (2026-11-07).
#
# What fits, as checked online on 2026-11-08:
# - compute-runtime 26.40.40196.8 (2026-11-03): its release notes name intel-graphics-compiler v2.42.6,
#   gmmlib 22.10.2 and level-zero v1.34.0 as the components it was built and tested with; Battlemage is
#   "Production" at Level Zero 1.18. sha256 from its ww40.sum.
# - IGC v2.42.6 (2026-10-26), sha256 from its release notes.
# - Level Zero loader v1.35.0 (2026-10-26, spec 1.20.41): one release past the v1.34.0 compute-runtime names; the
#   loader is backward compatible, and others pair it with 26.40 already. It publishes no sum: pinned by the sha256 downloaded 2026-11-08.
#   Loader >= 1.32 also avoids intel/llvm#22958 (the B70 first-submit crash in the L0 v2 adapter), fixed in the
#   runtime 2026-08-25.
# - oneAPI 2026.2.0 (intel/oneapi:2026.2.0-devel-ubuntu24.04, Ubuntu 24.04 as the live builder): Intel's 2026
#   toolkit notes list no compute-runtime minimum for client GPUs and no known issues for 2026.2.
# Not confirmed by any source: this exact set running llama.cpp on a B70 (the published B70 reports use oneAPI
# 2026.1.x with compute-runtime 26.31-26.35). The node's L0 trace (zeInit through the L0 adapter) decides.
ONEAPI_IMAGE=intel/oneapi:2026.2.0-devel-ubuntu24.04
CR=https://github.com/intel/compute-runtime/releases/download/26.40.40196.8
IGC=https://github.com/intel/intel-graphics-compiler/releases/download/v2.42.6
L0=https://github.com/oneapi-src/level-zero/releases/download/v1.35.0
DEBS="
b2868d6d7958cc5ca28fa9b48a7d39961760ee39ef07673d5b58894dd53d6b4e $CR/intel-ocloc_26.40.40196.8-0_amd64.deb
96046069e94680b761df6e83ddc64244721178b826e3e1f8af3ca104cfd0c7c2 $CR/intel-opencl-icd_26.40.40196.8-0_amd64.deb
053fceadb84a1d2f9a30a0d1bc9b16424b3f1a90cc49900fcd80aadcf25c8a4d $CR/libigdgmm12_22.10.2_amd64.deb
d9c86b2bb195baea6936c2708846cd1fceeadc39bc5e167f728858a5ca6fb86e $CR/libze-intel-gpu1_26.40.40196.8-0_amd64.deb
e20539632f2d99875d8f8b225d5da58b31f98baa54bb47c6328aa98ec473ab9d $IGC/intel-igc-core-2_2.42.6+23070_amd64.deb
7f5593cf828503ffb8450967768bde9209e22753bc576296e846b5a751011fa3 $IGC/intel-igc-opencl-2_2.42.6+23070_amd64.deb
8420f4fd710a44bed054afad2f7e0fbc408d8b3e266a2b5464bd4ab71a0dfcf3 $L0/libze1_1.35.0+u24.04_amd64.deb
aa5e3c57f037121f75a8d0b7e08fbf3dbdec33f39b11ace30b81af3485c598f8 $L0/libze-dev_1.35.0+u24.04_amd64.deb
"

# A newer Intel GPU stack for the SYCL engine (rebuild step b, operator 2026-11-07: "Start from a+b").
# Read by build.sh when INTEL_STACK=<this file>. Every package is pinned by URL and sha256; the builder base is
# LocalAI's own Dockerfile.base-grpc-builder on ONEAPI_IMAGE, and these debs are installed on top of it (they win
# over the versions install-base-deps.sh takes from Intel's apt repository, which move).
#
# Sources: compute-runtime 26.35.39758.10 (2026-09-17; sha256 from its ww35.sum), which names IGC v2.41.5 and
# Level Zero v1.32.0 as its tested pair. No intel/oneapi-basekit image exists for 2026.x; intel/oneapi has
# 2026.1.0 on Ubuntu 24.04, the same Ubuntu as the live engine's builder (one OS, not two changes).
ONEAPI_IMAGE=intel/oneapi:2026.1.0-devel-ubuntu24.04
CR=https://github.com/intel/compute-runtime/releases/download/26.35.39758.10
IGC=https://github.com/intel/intel-graphics-compiler/releases/download/v2.41.5
L0=https://github.com/oneapi-src/level-zero/releases/download/v1.32.0
DEBS="
c64bff586edf2bd9b49f3e4c9c2be25e05c43466e4dafa2a2c3948d498c736b7 $CR/intel-ocloc_26.35.39758.10-0_amd64.deb
61712caaddeba3d38e4f79e2a0fb23fea25596ca2d72c3144c6eea2331ec4301 $CR/intel-opencl-icd_26.35.39758.10-0_amd64.deb
6031a63d6e8a12ce61c14efc15f2c8e727061286e3820b8594e6d00615e04d54 $CR/libigdgmm12_22.10.0_amd64.deb
c19a641b953d55aebbf1d51bec364a84bf629f985e02fbbe6dc70224c0e88470 $CR/libze-intel-gpu1_26.35.39758.10-0_amd64.deb
- $IGC/intel-igc-core-2_2.41.5+22716_amd64.deb
- $IGC/intel-igc-opencl-2_2.41.5+22716_amd64.deb
- $L0/libze1_1.32.0+u24.04_amd64.deb
- $L0/libze-dev_1.32.0+u24.04_amd64.deb
"
# "-": IGC and Level Zero publish no sum file beside these assets; build.sh records the sha256 it downloaded in
# the build's own record (stack.lock beside the tar), so the engine names exactly the bytes it was built with.

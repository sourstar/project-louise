# THE GPU GOVERNOR (app/gpu_governor.py, docs/notes/scheduling.md §12): a
# TrueNAS app of its OWN, never a service of louise-rag.
#
# What it does. It holds the Arc's min_freq at its maximum while the node's
# interactive claim is live. Measured 2026-09-20: a chat call alone on the
# card took 87 s at a mean of 990 MHz, and 64 s with the clock held. Absent,
# the System tab says so and chat is slower on an idle card; nothing else
# depends on it. It moves into the model pool when that exists.
#
# Why its own app. 2026-09-20, the first deploy, as a service of louise-rag:
# - TrueNAS rewrote the long-syntax bind into short `source:target:rw`;
# - the card's PCI path (/sys/bus/pci/devices/0000:03:00.0/...) has
#   colons, so the spec was invalid;
# - one service failing to create fails the whole app's `up`: Louise was
#   down until the service was removed.
# An optional helper must not share an app with what it helps.
#
# Its paths, BY THE CARD'S ADDRESS, NEVER A CARD NUMBER. DRM card numbers are
# handed out in load order and swap across boots: the B70 went card0 -> card1
# on 2026-09-22 (RAGE's clock, f1b9dfc) and again at the reboot of 2026-11-23
# 10:17Z, when this app would not start ("error while creating mount source
# path '/sys/class/drm/card0/device/tile0/gt0/freq0': ... operation not
# permitted": card0 was the Radeon). The address is the stable name, but it
# has colons and TrueNAS splits a bind on them (the long form too). So each
# bind names a colon-free SYMLINK on the pool, pointing at the address —
#   /mnt/ssd5/apps/louise-gpu-governor/gpufreq  -> /sys/bus/pci/devices/0000:03:00.0/tile0/gt0/freq0
#   /mnt/ssd5/apps/louise-gpu-governor/gpuhwmon -> /sys/bus/pci/devices/0000:03:00.0/hwmon
# made by the deploy's stage 8 before this file is applied (GOVERNOR_GPU_PCI,
# deploy-louise-madlad-t5.sh), and Docker resolves them. If the card is not
# at that address the deploy says so and the app stays as it was; Louise is
# untouched. It also mounts the node store's directory for the claim and its
# heartbeat. (München's hand-made links of 10:17Z, under the model pool's old
# folder, are left for the operator to remove once a deploy has made these.)
#
# The profile's GPU level (2026-10-27, docs/notes/node-profiles-design.md;
# app/gpu_level.py). It reads platform.toml's [schedule] (the config
# directory, read-only) in the node's local time (TZ, the same as Louise's),
# and writes the card's power limit, hwmon `power1_max`: the card's
# `device/hwmon/` is bound writable at /gpuhwmon (hwmonN inside; N changes
# across boots, so it is found, never named). Where `power1_max` is absent or
# read-only it writes `max_freq` in /gpufreq instead. It replaces the root
# cron deploy/scheduled/gpu-cap.sh. A limit changes how fast a vector comes,
# never its bytes.
#
# What it gets. No network. Never louise-rag's env, which carries
# ADMIN_TOKEN. Init forwards the stop signal; SIGTERM gives the clock, the
# power limit and the clock ceiling back.

services:
  gpu-governor:
    image: louise-rag:local
    pull_policy: never
    restart: unless-stopped
    init: true
    command: ['python', '-m', 'app.gpu_governor']
    network_mode: none
    environment:
      DATA_DIR: /data
      CONFIG_DIR: /config
      TZ: Europe/Rome
    volumes:
      # the source is replaced at every deploy by the louise-rag app's own /data + /state
      # (deploy/16f/flatten_mounts.py governor_config; storage-tiering.md §12)
      - /mnt/ssd3/louise-data/state:/data/state      # /data on ssd3 since 2026-11-23
      - /mnt/ssd4/apps/louise-rag/config:/config:ro
      - /mnt/ssd5/apps/louise-gpu-governor/gpufreq:/gpufreq
      - /mnt/ssd5/apps/louise-gpu-governor/gpuhwmon:/gpuhwmon
    stop_grace_period: 10s
